name: Deploy to GitHub Pages

on:
  # main 브랜치에 push가 발생할 때마다 실행됩니다.
  push:
    branches:
      - main
  # GitHub Actions 탭에서 수동으로 실행할 수 있도록 허용합니다.
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 실행되지 않도록 제어
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # [중요] GitHub Secrets에 저장된 API 키를 소스 코드에 주입합니다.
      # 소스 코드 저장소에는 키가 노출되지 않지만, 배포된 웹사이트의 클라이언트 코드에는 포함됩니다.
      - name: Inject API Key from Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Error: GEMINI_API_KEY secret is not set."
            exit 1
          fi
          # services/gemini.ts 파일 내의 process.env.API_KEY를 실제 키 문자열로 치환합니다.
          sed -i "s/process.env.API_KEY/'$GEMINI_API_KEY'/g" services/gemini.ts

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 별도의 빌드 과정이 없으므로 현재 디렉토리('.') 전체를 업로드합니다.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
