<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax & Legal AI Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1e3a8a', // blue-900
            secondary: '#3b82f6', // blue-500
            accent: '#f59e0b', // amber-500
          }
        }
      }
    }
  </script>
  <style>
    /* Basic styling for markdown content since we can't easily use @tailwindcss/typography plugin via CDN without build step */
    .markdown-body h1 { font-size: 1.875rem; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    .markdown-body h2 { font-size: 1.5rem; font-weight: 600; margin-top: 1.5em; margin-bottom: 0.5em; color: #1f2937; }
    .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.2em; margin-bottom: 0.5em; color: #374151; }
    .markdown-body p { margin-top: 0; margin-bottom: 1em; line-height: 1.7; color: #4b5563; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; color: #4b5563; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; color: #4b5563; }
    .markdown-body li { margin-bottom: 0.25em; }
    .markdown-body strong { font-weight: 600; color: #111827; }
    .markdown-body blockquote { border-left: 4px solid #e5e7eb; padding-left: 1em; color: #6b7280; font-style: italic; margin-bottom: 1em; }
    .markdown-body code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.875em; font-family: monospace; color: #ef4444; }
    .markdown-body pre { background-color: #1f2937; color: #f9fafb; padding: 1em; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1em; }
    .markdown-body pre code { background-color: transparent; color: inherit; padding: 0; }
  </style>
  </head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-grow flex flex-col"></div>
<script type="module" src="/index.js"></script></body>
</html>
