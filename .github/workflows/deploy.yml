name: Deploy to GitHub Pages

on:
  # main 브랜치에 push가 발생할 때마다 실행됩니다.
  push:
    branches:
      - main
  # GitHub Actions 탭에서 수동으로 실행할 수 있도록 허용합니다.
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 실행되지 않도록 제어
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # [중요] Secrets의 GEMINI_API_KEY 주입 및 경로 수정 (frontend/services/gemini.ts)
      - name: Inject API Key from Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Error: GEMINI_API_KEY secret is not set."
            exit 1
          fi
          # 실제 파일 경로(frontend/services/gemini.ts)에 맞게 sed 수행
          sed -i "s/process.env.API_KEY/'$GEMINI_API_KEY'/g" frontend/services/gemini.ts

      # 의존성 패키지 설치 (frontend 디렉터리 지정)
      - name: Install dependencies
        run: npm install --prefix frontend

      # Vite 프론트엔드 빌드 실행 (frontend 디렉터리 지정)
      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 빌드 결과물(frontend/dist) 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
